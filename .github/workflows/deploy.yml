name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 7679249973b3ca7cd658c198c69e1e5e

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply D1 migrations
        run: npx wrangler@4.161.0 d1 migrations apply DB --remote

      - name: Version asset URLs
        run: scripts/stamp-assets.sh "${GITHUB_SHA::8}"

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@4.161.0 pages deploy --project-name=pizza-contest --branch=main --commit-dirty=true
