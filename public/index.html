<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pizza Contest v2</title>
  <meta name="description" content="Pizza Contest v2, November 2026">
  <meta property="og:title" content="Pizza Contest v2">
  <meta property="og:description" content="November 2026">
  <meta property="og:image" content="https://pizzacontest.ca/assets/pizza-dance.gif">
  <meta property="og:url" content="https://pizzacontest.ca/">
  <link rel="preload" href="/assets/fonts/chewy.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/base.css">
  <link rel="stylesheet" href="/assets/home.css">
  <script type="module" src="/assets/home.js"></script>
</head>
<body>
  <main class="home">
    <h1 class="title">Pizza<br>Contest <span class="v">v2</span></h1>
    <p class="when">November 2026</p>

    <svg class="guy" id="guy" viewBox="0 0 240 300" role="img" aria-label="A slice of pizza doing the Macarena">
      <ellipse id="floor" class="floor" cx="120" cy="288" rx="52" ry="6"/>

      <path id="legA" class="limb"/>
      <path id="legB" class="limb"/>
      <g id="shoeA"><ellipse class="shoe" cx="-6" cy="2" rx="15" ry="7"/></g>
      <g id="shoeB"><ellipse class="shoe" cx="6" cy="2" rx="15" ry="7"/></g>

      <g id="body">
        <path class="cheese" d="M60 60 Q120 36 180 60 L120 238 Z"/>
        <path class="crust" d="M60 60 Q120 36 180 60"/>
        <path class="crust-shine" d="M76 54 Q120 38 164 54"/>
        <circle class="pep" cx="86" cy="80" r="10"/>
        <circle class="pep" cx="154" cy="82" r="9"/>
        <circle class="pep" cx="100" cy="170" r="8"/>
        <circle class="pep" cx="140" cy="164" r="7"/>
        <circle class="pep" cx="120" cy="206" r="5"/>

        <ellipse class="eye" cx="108" cy="92" rx="7" ry="9"/>
        <ellipse class="eye" cx="132" cy="92" rx="7" ry="9"/>
        <circle class="pupil" cx="108" cy="94" r="3.6"/>
        <circle class="pupil" cx="132" cy="94" r="3.6"/>
        <ellipse class="cheek" cx="98" cy="110" rx="6" ry="3.5"/>
        <ellipse class="cheek" cx="142" cy="110" rx="6" ry="3.5"/>
        <g id="mouth">
          <path class="smile" d="M109 112 Q120 124 131 112"/>
          <ellipse class="o" cx="120" cy="117" rx="5.5" ry="7"/>
        </g>

        <path id="armA" class="limb"/>
        <path id="armB" class="limb"/>
        <g id="handA" class="hand"><circle class="glove" r="10"/><path class="cuff" d="M6 -7 L10 -2"/><ellipse class="palm-mark" cx="-1" cy="1" rx="4.5" ry="5"/></g>
        <g id="handB" class="hand"><circle class="glove" r="10"/><path class="cuff" d="M6 -7 L10 -2"/><ellipse class="palm-mark" cx="-1" cy="1" rx="4.5" ry="5"/></g>
      </g>
    </svg>

    <a class="button enter" href="/app/">Enter</a>
    <a class="results-link" id="results-link" href="/results/" hidden>See the results</a>
  </main>
</body>
</html>
