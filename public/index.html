<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pizza Contest v2</title>
  <link rel="stylesheet" href="/assets/base.css">
  <link rel="stylesheet" href="/assets/home.css">
  <script type="module" src="/assets/home.js"></script>
</head>
<body>
  <main class="home">
    <h1>Pizza Contest <span class="v">v2</span></h1>
    <p class="when">November 2026</p>

    <svg class="guy" viewBox="0 0 200 260" role="img" aria-label="A slice of pizza dancing">
      <g class="body">
        <g class="leg leg-l"><path d="M88 196 L78 236" /><ellipse cx="72" cy="240" rx="14" ry="7" class="shoe"/></g>
        <g class="leg leg-r"><path d="M112 196 L122 236" /><ellipse cx="128" cy="240" rx="14" ry="7" class="shoe"/></g>

        <path class="cheese" d="M26 48 Q100 22 174 48 L100 214 Z"/>
        <path class="crust" d="M26 48 Q100 22 174 48"/>
        <circle class="pep" cx="60" cy="68" r="11"/>
        <circle class="pep" cx="142" cy="70" r="10"/>
        <circle class="pep" cx="82" cy="150" r="9"/>
        <circle class="pep" cx="120" cy="148" r="8"/>
        <circle class="pep" cx="100" cy="186" r="6"/>
        <g class="arm arm-l"><path d="M46 92 L12 92" /><circle cx="9" cy="92" r="9" class="glove"/></g>
        <g class="arm arm-r"><path d="M154 92 L188 92" /><circle cx="191" cy="92" r="9" class="glove"/></g>
        <g class="face">
          <circle cx="86" cy="96" r="6"/>
          <circle cx="114" cy="96" r="6"/>
          <path d="M84 116 Q100 132 116 116" class="smile"/>
        </g>
      </g>
      <ellipse class="floor" cx="100" cy="250" rx="46" ry="5"/>
    </svg>

    <a class="button enter" href="/app/">Enter</a>
    <a class="results-link" id="results-link" href="/results/" hidden>See the results</a>
  </main>
</body>
</html>
